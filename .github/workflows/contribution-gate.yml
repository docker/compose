name: Contribution gate

# pull_request_target is required so that comments can be posted on PRs from
# forks (the GITHUB_TOKEN has write access to the base repo). No PR code is
# ever checked out or executed — only GitHub API calls are made.
permissions:
  contents: read
  pull-requests: write

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

jobs:
  gate:
    runs-on: ubuntu-latest
    name: AI disclosure / engagement check
    steps:
      - name: Block merge while AI_AGENT_DISCLOSURE.md is present
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --paginate --jq '.[] | select(.status != "removed") | .filename')
          if echo "$files" | grep -qE '(^|/)AI_AGENT_DISCLOSURE\.md$'; then
            echo "::error::This pull request contains AI_AGENT_DISCLOSURE.md, which states the change may not have been independently reviewed or tested by its human submitter. Please review the code your AI agent produced yourself, then remove the file from the commits (amend/rebase) to confirm that manual review took place. The merge stays blocked while the file is present."
            exit 1
          fi
          echo "No AI_AGENT_DISCLOSURE.md in this pull request."

      - name: Warn if no prior engagement on linked issue
        # Only fire on initial submission, not on every follow-up push.
        if: github.event.action == 'opened'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_DATE: ${{ github.event.pull_request.created_at }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPO: ${{ github.repository }}
        run: |
          # Extract the first issue referenced in the PR body
          # (matches: fixes #N, closes #N, resolves #N — case-insensitive)
          BODY=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.body // ""')
          ISSUE=$(echo "$BODY" | grep -ioE '(fixes|closes|resolves)[[:space:]]+#([0-9]+)' \
            | grep -oE '[0-9]+' | head -1)

          if [ -z "$ISSUE" ]; then
            echo "No linked issue found — skipping engagement check."
            exit 0
          fi

          # Count comments the PR author posted on the issue BEFORE the PR was opened.
          PRIOR=$(gh api "repos/$REPO/issues/$ISSUE/comments" \
            --paginate \
            --jq "[.[] | select(.user.login == \"$PR_AUTHOR\" and .created_at < \"$PR_DATE\")] | length")

          if [ "$PRIOR" -gt 0 ]; then
            echo "$PR_AUTHOR had $PRIOR comment(s) on issue #$ISSUE before this PR — OK."
            exit 0
          fi

          echo "::warning::$PR_AUTHOR has no prior comment on issue #$ISSUE before opening this PR."

          MESSAGE="👋 Thanks for the contribution!

          Before we review, a few questions:
          - Have you discussed this change in issue #${ISSUE} before opening this PR?
          - Have you manually reproduced the bug and verified that this fix resolves it end-to-end?
          - Is this your own analysis of the root cause, or was the patch generated by an automated tool without independent review?

          We're seeing a rise in automated PR submissions that have not been independently validated. \
          Contributions are welcome — including AI-assisted ones — when the author has genuinely understood and tested the change. \
          A short reply to the above will help us prioritise the review.

          _(This message is automated and fires when no prior engagement on the linked issue is detected from the PR author. \
          If you discussed this elsewhere, please link the conversation.)_"

          gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$MESSAGE"
