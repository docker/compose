services:
  web:
    image: alpine
    init: true
    command: sleep infinity
jobs:
  # Fails on purpose: a successful run is removed on exit (RemoveOnSuccess),
  # leaving nothing to observe — failing keeps the container around
  # (RemoveOnFailure: false) so the fire is verifiable via container state.
  backup:
    image: alpine
    command: sh -c 'exit 1'
    # repeated `up -d` below must see the identical spec hash each time
    environment:
      A: "1"
      B: "2"
      C: "3"
      D: "4"
    triggers:
      schedule:
        - cron: "* * * * *"
