services:
  db:
    image: gtardif/sentences-db
    init: true
  words:
    image: gtardif/sentences-api
    init: true
    ports:
      - "8080"
  web:
    image: gtardif/sentences-web
    init: true
    ports:
      - "80"
    labels:
      - "my-label=test"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 2s
