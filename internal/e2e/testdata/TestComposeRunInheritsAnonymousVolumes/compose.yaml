services:
  task:
    image: alpine
    command: echo "task done"
    depends_on:
      - dep
  dep:
    image: alpine
    init: true
    command: sleep infinity
    volumes:
      # anonymous volume: no source, so it lives and dies with the container
      # unless carried over on recreate
      - /data
    environment:
      # divergence vector: changing TAG between invocations changes the
      # config-hash of dep, which the default policy answers by recreating
      TAG: ${TAG:-initial}
